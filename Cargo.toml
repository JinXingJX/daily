[workspace]
members = ["crates/daily-agent-core", "crates/daily-agent-providers", "crates/daily-core", "crates/daily-desktop-runtime", "crates/daily-app-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["JinXingJX"]
license = "MIT"
repository = "https://github.com/JinXingJX/daily"
homepage = "https://github.com/JinXingJX/daily"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
eventsource-stream = "0.2.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy", "stream", "cookies", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
