name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-sdk:
    name: Standalone SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-sdk
      - name: Fetch all SDK feature dependencies for offline checks
        run: cargo fetch --locked
      - name: SDK tests without desktop or login features
        run: cargo test --locked -p daily-agent-core -p daily-agent-providers
      - name: SDK lint
        run: cargo clippy --locked -p daily-agent-core -p daily-agent-providers --all-targets -- -D warnings
      - name: Standalone SDK consumer
        run: npm run check:agent-sdk
      - name: SDK source distribution
        run: npm run package:agent-sdk

  test:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: npm run test:rust
      - name: Protocol check
        run: npm run check:protocol
      - name: Renderer tests
        run: npm run test:renderer
      - name: Electron sidecar tests
        run: npm run test:electron
      - name: Production build
        run: npm run build
      - name: Plugin SDK type check
        run: npx tsc -p packages/plugin-sdk/tsconfig.json

  windows-package:
    name: Windows installer
    needs: [test, agent-sdk]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - run: npm ci
      - name: Build unsigned x64 installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged sidecar
        shell: pwsh
        run: |
          $sidecar = "release/win-unpacked/resources/bin/daily-app-server.exe"
          if (!(Test-Path $sidecar)) { throw "Packaged sidecar is missing" }
      - name: Test the shipped sidecar
        run: npx vitest run electron/main/sidecar.test.ts
        env:
          DAILY_TEST_SIDECAR: release/win-unpacked/resources/bin/daily-app-server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
