name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Alternatives you considered are welcome too.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat and agents
        - Model providers
        - Plugins and SDK
        - Settings
        - Packaging and platforms
        - Other
