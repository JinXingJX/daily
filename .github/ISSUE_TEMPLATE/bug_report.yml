name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens, or private workspace contents.
        Security issues go to https://github.com/JinXingJX/daily/security/advisories/new instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daily version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15.1, Apple Silicon
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - OpenAI compatible
        - Anthropic
        - Gemini
        - Codex (unofficial)
        - Antigravity (unofficial)
        - Not related to a provider
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output from `npm run dev` (sidecar logs are prefixed with `[daily-app-server:`), or screenshots.
      render: text
