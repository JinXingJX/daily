[package]
name = "daily-agent-providers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Model providers and HTTP transports for the Daily agent SDK"

[dependencies]
daily-agent-core = { version = "0.1.0", path = "../daily-agent-core" }
async-trait.workspace = true
base64.workspace = true
eventsource-stream.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
time = { version = "0.3", features = ["parsing"], optional = true }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[features]
default = []
login = ["dep:time"]
ts = ["dep:ts-rs", "daily-agent-core/ts"]
